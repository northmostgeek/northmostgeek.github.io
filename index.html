<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>northmostgeek · Apps</title>
<meta name="robots" content="index, follow">
<style>
  :root {
    --accent: #01B06F;
    --text: #1a1d1f;
    --text-secondary: #6b7280;
    --border: rgba(0, 0, 0, 0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    color: var(--text); background: #fafafa; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
  header { text-align: center; margin-bottom: 40px; }
  h1 { font-size: 26px; font-weight: 700; }
  .subtitle { color: var(--text-secondary); font-size: 15px; margin-top: 6px; }
  .card {
    display: block; background: #fff; border: 1px solid var(--border);
    border-radius: 16px; padding: 24px 28px; margin-bottom: 16px;
    text-decoration: none; color: inherit;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .card h2 { font-size: 18px; color: var(--accent); display: flex; align-items: center; gap: 10px; }
  .card p { color: var(--text-secondary); font-size: 14px; margin-top: 8px; }
  .arrow { margin-left: auto; color: var(--text-secondary); }
  footer {
    text-align: center; color: var(--text-secondary);
    font-size: 13px; margin-top: 48px; border-top: 1px solid var(--border); padding-top: 24px;
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>northmostgeek</h1>
    <p class="subtitle">Apps · Legal Information / 应用与法律信息</p>
  </header>

  <a class="card" href="./welldone/">
    <h2>Welldone <span class="arrow">→</span></h2>
    <p>Daily Wins Journal · 每日成功日记 — Privacy Policy / Terms of Use（隐私政策 / 使用条款）</p>
  </a>

  <footer>
    <p>© 2026 northmostgeek · <a href="mailto:northmostgeek@gmail.com">northmostgeek@gmail.com</a></p>
  </footer>
</div>
</body>
</html>
